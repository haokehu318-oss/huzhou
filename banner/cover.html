<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>作品封面 · 即案 FLASHPLAN</title>
<style>
/* 作品广场卡片封面：16:9，800×450 排版，2 倍导出 1600×900。卡片缩得很小，所以只放名字、一句话和一个数字 */
:root{--ink:#221c1a;--ink2:#5d544f;--paper:#f6f2ec;--red:#c2372d}
*{box-sizing:border-box;margin:0}
html,body{width:800px;height:450px;overflow:hidden;background:var(--paper)}
body{font:16px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
.bg{position:absolute;inset:0 0 0 300px;background:url(img/hero.png) 50% 58%/cover}
.bg::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--paper) 0,rgba(246,242,236,.75) 22%,rgba(246,242,236,0) 48%)}
.t{position:absolute;left:44px;top:46px;width:430px}
.brand{display:flex;align-items:baseline;gap:12px;font-size:44px;font-weight:800;line-height:1}
.brand b{color:var(--red)}.brand span{font:800 26px/1 system-ui,sans-serif;letter-spacing:.14em;color:var(--red)}
h1{font-size:40px;line-height:1.15;letter-spacing:-.01em;margin-top:26px}
h1 span{color:var(--red)}
p{font-size:17px;color:var(--ink2);margin-top:14px;line-height:1.55}
.tag{display:inline-flex;align-items:baseline;gap:10px;margin-top:22px;background:rgba(255,253,250,.85);border:1px solid rgba(34,28,26,.12);border-radius:10px;padding:8px 14px}
.tag b{font-size:22px;color:var(--red)}.tag span{font-size:14px;color:var(--ink2)}
.foot{position:absolute;left:44px;bottom:26px;font-size:13px;color:var(--ink2)}
</style>
</head>
<body>
<div class="bg" role="img" aria-label="AI 生成主视觉：黄昏的上海街道，红色公交车身广告与沿街门店"></div>
<div class="t">
  <div class="brand"><b>即案</b><span>FLASHPLAN</span></div>
  <h1><span>当天</span>出案，<span>当场</span>改案</h1>
  <p>户外投放 AI 提案工作台：输入品牌、预算和档期，自动选公交和地铁口，核对红豆空位，生成客户提案。</p>
  <div class="tag"><b>好几天 → 几十秒</b><span>一份完整提案的出案时间</span></div>
</div>
<div class="foot">INTERCITY HACK 湖州场 · AI+办公 · 上海新云传媒命题</div>
</body>
</html>
